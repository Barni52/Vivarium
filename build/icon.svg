<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D2230"/>
      <stop offset="1" stop-color="#12151D"/>
    </linearGradient>
    <linearGradient id="spark" x1="128" y1="106" x2="128" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBB2FF"/>
      <stop offset="1" stop-color="#9A75F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="140" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C7BF2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9C7BF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app-tile background -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- container lid -->
  <rect x="60" y="70" width="136" height="16" rx="8" fill="#AEB5CC"/>

  <!-- container body (open-topped box) -->
