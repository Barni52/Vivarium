        stroke="#AEB5CC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- agent sparkle -->
  <circle cx="128" cy="140" r="44" fill="url(#glow)"/>
  <path d="M128 108
           Q133 135 155 140
           Q133 145 128 172
           Q123 145 101 140
           Q123 135 128 108 Z"
