<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cont" x1="128" y1="66" x2="128" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A93FF"/>
      <stop offset="1" stop-color="#5B63F0"/>
    </linearGradient>
    <linearGradient id="spark" x1="128" y1="102" x2="128" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6B6FF"/>
      <stop offset="1" stop-color="#9A4DF0"/>
    </linearGradient>
  </defs>

  <!-- Icon-only mark (no background tile): the logo scaled up to fill the canvas,
       centered. Vivid indigo container (thick solid stroke + filled lid) with a
       distinct bright-purple sparkle so both read clearly on any background. -->
  <g transform="translate(128 128) scale(1.72) translate(-128 -132)">
    <!-- container lid -->
    <rect x="58" y="68" width="140" height="18" rx="9" fill="url(#cont)"/>

    <!-- container body (open-topped box) -->
    <path d="M74 92 L74 160 Q74 189 103 189 L153 189 Q182 189 182 160 L182 92"
          stroke="url(#cont)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- agent sparkle (enlarged) -->
    <g transform="translate(128 140) scale(1.16) translate(-128 -140)">
      <path d="M128 108
               Q133 135 155 140
               Q133 145 128 172
               Q123 145 101 140
               Q123 135 128 108 Z"
            fill="url(#spark)"/>
    </g>
  </g>
</svg>
